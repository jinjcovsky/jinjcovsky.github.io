<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jans Live-Standort</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; }
        #map { height: 100vh; width: 100vw; }
        .info-box {
            position: absolute;
            bottom: 20px;
            left: 20px;
            z-index: 1000;
            background: white;
            padding: 10px 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <div id="info" class="info-box">Lade Standort...</div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    
    <script>
        // 1. Initialize the map
        const map = L.map('map').setView([0, 0], 2);
 
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors',
            maxZoom: 19
        }).addTo(map);
 
        let marker = null;
 
        // a slow connection) can't stack up or race each other
        let currentController = null;
 
        // request would otherwise sit forever
        async function fetchWithTimeout(url, ms, signal) {
            const timeoutId = setTimeout(() => currentController?.abort(), ms);
            try {
                return await fetch(url, { signal });
            } finally {
                clearTimeout(timeoutId);
            }
        }
 
        // 2. Fetch data from your Cloudflare Worker
        async function updateLocation() {
            if (currentController) currentController.abort();
            currentController = new AbortController();
 
            try {
                const response = await fetchWithTimeout(
                    'https://owntracks-backend.jkienast-at.workers.dev/location',
                    10000, // 10s timeout
                    currentController.signal
                );
 
                if (!response.ok) {
                    throw new Error(`Server antwortete mit Status ${response.status}`);
                }
 
                const data = await response.json();
 
                if (typeof data.lat === 'number' && typeof data.lon === 'number') {
                    const latLng = [data.lat, data.lon];
 
                    if (!marker) {
                        marker = L.marker(latLng).addTo(map);
                        map.setView(latLng, 14); // Zoom in on first load
                    } else {
                        marker.setLatLng(latLng);
                    }
 
                    const batteryText = typeof data.battery === 'number' ? `${data.battery}%` : 'unbekannt';
                    const lastUpdate = data.time ? new Date(data.time * 1000).toLocaleString() : 'unbekannt';
 
                    const statusText = `<b>Akku:</b> ${batteryText}<br><b>Zuletzt gesehen:</b> ${lastUpdate}`;
                    marker.bindPopup(statusText);
                    document.getElementById('info').innerHTML = statusText;
                }
            } catch (error) {
                // only show a user-facing message for real failures
                if (error.name !== 'AbortError') {
                    console.error("Problem den Standort abzurufen:", error);
                    document.getElementById('info').innerHTML = "Problem beim Laden der Standortdaten.";
                }
            }
        }
 
        // battery/data on a phone), resume + refresh immediately when it is
        let pollInterval = null;
 
        function startPolling() {
            if (pollInterval) return;
            updateLocation();
            pollInterval = setInterval(updateLocation, 30000);
        }
 
        function stopPolling() {
            if (pollInterval) {
                clearInterval(pollInterval);
                pollInterval = null;
            }
        }
 
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                stopPolling();
            } else {
                startPolling();
            }
        });
 
        // 3. Run immediately, then check for updates every 30 seconds
        startPolling();
    </script>
</body>
</html>
