<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blog Admin Dashboard</title>
    <meta name="robots" content="noindex, nofollow" />
    <style>
      .admin-helper-buttons {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
        margin-top: 0.5rem;
      }

      .admin-helper-button {
        border: 1px solid #cbd5e1;
        background: #f8fafc;
        color: #0f172a;
        border-radius: 0.375rem;
        padding: 0.4rem 0.7rem;
        cursor: pointer;
        font-size: 0.9rem;
      }

      .admin-helper-button:hover {
        background: #e2e8f0;
      }

      .admin-helper-status {
        margin-top: 0.35rem;
        font-size: 0.9rem;
        color: #475569;
      }

      .admin-helper-status.error {
        color: #b91c1c;
      }
    </style>
  </head>
  <body>
    <script src="https://unpkg.com/decap-cms@3.15.0/dist/decap-cms.js"></script>
    <script>
      (function () {
        function createStatus(container, message, isError) {
          let status = container.querySelector('.admin-helper-status');
          if (!status) {
            status = document.createElement('div');
            status.className = 'admin-helper-status';
            container.appendChild(status);
          }
          status.textContent = message;
          status.classList.toggle('error', Boolean(isError));
          return status;
        }

        function dispatchInputEvent(input) {
          if (!input) return;
          input.dispatchEvent(new Event('input', { bubbles: true }));
          input.dispatchEvent(new Event('change', { bubbles: true }));
          input.dispatchEvent(new Event('blur', { bubbles: true }));
        }

        function setCoordinateValue(input, rawValue) {
          if (!input) return null;
          const sourceValue = rawValue == null ? '' : String(rawValue);
          const normalizedValue = sourceValue.replace(/,/g, '.').replace(/[^0-9.\-]/g, '');
          const parsedValue = normalizedValue === '' ? '' : String(parseFloat(normalizedValue));
          input.value = parsedValue;
          input.setAttribute('value', parsedValue);
          input.setAttribute('data-value', parsedValue);
          if (parsedValue !== '' && typeof input.valueAsNumber === 'number') {
            input.valueAsNumber = parseFloat(parsedValue);
          }
          dispatchInputEvent(input);
          return parsedValue;
        }

        function findFieldByLabel(labelText) {
          const labels = Array.from(document.querySelectorAll('label'));
          for (const label of labels) {
            if ((label.textContent || '').toLowerCase().includes(labelText)) {
              const control = label.closest('.field') || label.parentElement;
              const input = control && control.querySelector('input, textarea, select');
              if (input) return input;
            }
          }
          return null;
        }

        function getFieldContainer(input) {
          return input.closest('.field') || input.closest('.Widget') || input.closest('.Control') || input.parentElement;
        }

        function injectGeoButton() {
          const latInput = findFieldByLabel('latitude') || document.querySelector('input[name="lat"], input[name="fields[lat]"], input[id*="lat"]');
          const lonInput = findFieldByLabel('longitude') || document.querySelector('input[name="lon"], input[name="fields[lon]"], input[id*="lon"]');

          if (!latInput || !lonInput) return;
          const container = getFieldContainer(latInput);
          if (!container || container.querySelector('.admin-helper-button[data-role="geolocate"]')) return;

          const wrapper = document.createElement('div');
          wrapper.className = 'admin-helper-buttons';

          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'admin-helper-button';
          button.dataset.role = 'geolocate';
          button.textContent = 'Use my location';
          button.addEventListener('click', function (event) {
            event.preventDefault();
            if (!navigator.geolocation) {
              createStatus(container, 'Geolocation is not supported by this browser.', true);
              return;
            }

            navigator.geolocation.getCurrentPosition(
              function (position) {
                setCoordinateValue(latInput, position.coords.latitude.toFixed(6));
                setCoordinateValue(lonInput, position.coords.longitude.toFixed(6));
                createStatus(container, 'Location filled from your browser.', false);
              },
              function () {
                createStatus(container, 'Location access was denied or unavailable.', true);
              }
            );
          });

          wrapper.appendChild(button);
          container.appendChild(wrapper);
        }

        function attachHelpers() {
          injectGeoButton();
        }

        window.addEventListener('load', function () {
          attachHelpers();
          let attempts = 0;
          const retry = window.setInterval(function () {
            attempts += 1;
            attachHelpers();
            if (attempts >= 10) {
              window.clearInterval(retry);
            }
          }, 400);
        });
      })();
    </script>
  </body>
</html>
