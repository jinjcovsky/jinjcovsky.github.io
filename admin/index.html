<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blog Admin Dashboard</title>
    <meta name="robots" content="noindex, nofollow" />
    <style>
      .admin-helper-buttons {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
        margin-top: 0.5rem;
      }

      .admin-helper-button {
        border: 1px solid #cbd5e1;
        background: #f8fafc;
        color: #0f172a;
        border-radius: 0.375rem;
        padding: 0.4rem 0.7rem;
        cursor: pointer;
        font-size: 0.9rem;
      }

      .admin-helper-button:hover {
        background: #e2e8f0;
      }

      .admin-helper-status {
        margin-top: 0.35rem;
        font-size: 0.9rem;
        color: #475569;
      }

      .admin-helper-status.error {
        color: #b91c1c;
      }
    </style>
  </head>
  <body>
    <script src="https://unpkg.com/decap-cms@3.15.0/dist/decap-cms.js"></script>
    <script>
      (function () {
        function createStatus(container, message, isError) {
          let status = container.querySelector('.admin-helper-status');
          if (!status) {
            status = document.createElement('div');
            status.className = 'admin-helper-status';
            container.appendChild(status);
          }
          status.textContent = message;
          status.classList.toggle('error', Boolean(isError));
          return status;
        }

        function dispatchInputEvent(input) {
          if (!input) return;
          input.dispatchEvent(new Event('input', { bubbles: true }));
          input.dispatchEvent(new Event('change', { bubbles: true }));
        }

        function normalizeCoordinateInput(input) {
          if (!input) return;
          const rawValue = input.value == null ? '' : String(input.value);
          const normalizedValue = rawValue.replace(/,/g, '.').replace(/[^0-9.\-]/g, '');
          if (normalizedValue !== rawValue) {
            input.value = normalizedValue;
            dispatchInputEvent(input);
          }
        }

        function readExifGps(file) {
          return new Promise(function (resolve, reject) {
            const reader = new FileReader();
            reader.onload = function () {
              const buffer = reader.result;
              if (!buffer) {
                reject(new Error('The image could not be read.'));
                return;
              }

              const view = new DataView(buffer);
              if (view.getUint8(0) !== 0xff || view.getUint8(1) !== 0xd8) {
                resolve(null);
                return;
              }

              let offset = 2;
              while (offset + 1 < buffer.byteLength) {
                const marker = view.getUint8(offset);
                if (marker !== 0xff) break;
                const markerType = view.getUint8(offset + 1);
                if (markerType === 0xd9 || markerType === 0xda) break;

                const segmentLength = view.getUint16(offset + 2, false);
                if (segmentLength < 2) break;

                if (markerType === 0xe1) {
                  const segmentStart = offset + 4;
                  const segmentEnd = Math.min(offset + 2 + segmentLength, buffer.byteLength);
                  if (segmentStart + 6 <= segmentEnd) {
                    const bytes = new Uint8Array(buffer.slice(segmentStart, segmentEnd));
                    const isExif = bytes[0] === 0x45 && bytes[1] === 0x78 && bytes[2] === 0x69 && bytes[3] === 0x66 && bytes[4] === 0x00 && bytes[5] === 0x00;
                    if (isExif) {
                      const tiffBytes = bytes.subarray(6);
                      const tiffView = new DataView(tiffBytes.buffer, tiffBytes.byteOffset, tiffBytes.byteLength);
                      const littleEndian = tiffView.getUint16(0, true) === 0x4949;
                      const signature = tiffView.getUint16(0, littleEndian ? true : false);
                      if (signature === 0x4949 || signature === 0x4d4d) {
                        const ifdOffset = tiffView.getUint32(4, littleEndian);
                        const ifdEntries = getExifEntries(tiffView, ifdOffset, littleEndian);
                        const gpsOffsetEntry = ifdEntries.find(function (entry) {
                          return entry.tag === 0x8825;
                        });

                        if (gpsOffsetEntry) {
                          const gpsEntries = getExifEntries(tiffView, gpsOffsetEntry.value, littleEndian);
                          const latitudeRefEntry = gpsEntries.find(function (entry) {
                            return entry.tag === 0x0001;
                          });
                          const latitudeEntry = gpsEntries.find(function (entry) {
                            return entry.tag === 0x0002;
                          });
                          const longitudeRefEntry = gpsEntries.find(function (entry) {
                            return entry.tag === 0x0003;
                          });
                          const longitudeEntry = gpsEntries.find(function (entry) {
                            return entry.tag === 0x0004;
                          });

                          if (latitudeEntry && longitudeEntry && latitudeRefEntry && longitudeRefEntry) {
                            const latitudeRef = readAsciiValue(tiffView, latitudeRefEntry);
                            const longitudeRef = readAsciiValue(tiffView, longitudeRefEntry);
                            const latitude = parseRationalArray(tiffView, latitudeEntry, littleEndian);
                            const longitude = parseRationalArray(tiffView, longitudeEntry, littleEndian);

                            if (latitude && longitude) {
                              resolve({
                                lat: convertDmsToDecimal(latitude, latitudeRef),
                                lon: convertDmsToDecimal(longitude, longitudeRef),
                              });
                              return;
                            }
                          }
                        }
                      }
                    }
                  }
                }

                offset += 2 + segmentLength;
              }

              resolve(null);
            };

            reader.onerror = function () {
              reject(reader.error || new Error('The image could not be read.'));
            };

            reader.readAsArrayBuffer(file);
          });
        }

        function getExifEntries(view, ifdOffset, littleEndian) {
          if (ifdOffset < 0 || ifdOffset + 2 > view.byteLength) {
            return [];
          }

          const count = view.getUint16(ifdOffset, littleEndian);
          const entries = [];
          let cursor = ifdOffset + 2;

          for (let index = 0; index < count; index += 1) {
            if (cursor + 12 > view.byteLength) break;
            entries.push({
              tag: view.getUint16(cursor, littleEndian),
              type: view.getUint16(cursor + 2, littleEndian),
              count: view.getUint32(cursor + 4, littleEndian),
              value: view.getUint32(cursor + 8, littleEndian),
            });
            cursor += 12;
          }

          return entries;
        }

        function parseRationalArray(view, entry, littleEndian) {
          if (!entry || entry.count < 3) return null;
          const values = [];
          const startOffset = entry.value;
          for (let index = 0; index < entry.count; index += 1) {
            const position = startOffset + index * 8;
            if (position + 8 > view.byteLength) return null;
            const numerator = view.getUint32(position, littleEndian);
            const denominator = view.getUint32(position + 4, littleEndian);
            values.push({ numerator, denominator });
          }
          return values;
        }

        function readAsciiValue(view, entry) {
          if (!entry) return '';
          const bytes = [];
          const startOffset = entry.value;
          for (let index = 0; index < Math.min(entry.count, 8); index += 1) {
            if (startOffset + index >= view.byteLength) break;
            bytes.push(view.getUint8(startOffset + index));
          }
          return String.fromCharCode.apply(null, bytes).replace(/\0/g, '').trim();
        }

        function convertDmsToDecimal(dms, ref) {
          if (!dms || dms.length < 3) return null;
          const degrees = dms[0].numerator / dms[0].denominator;
          const minutes = dms[1].numerator / dms[1].denominator;
          const seconds = dms[2].numerator / dms[2].denominator;
          const decimal = degrees + minutes / 60 + seconds / 3600;
          return ref === 'S' || ref === 'W' ? -decimal : decimal;
        }

        function getLatLonInputs() {
          const lat = document.querySelector('input[name="lat"], input[name="fields[lat]"], input[id*="lat"]');
          const lon = document.querySelector('input[name="lon"], input[name="fields[lon]"], input[id*="lon"]');
          return { lat, lon };
        }

        function injectGeoButton() {
          const { lat, lon } = getLatLonInputs();
          if (!lat || !lon) return;
          const container = lat.closest('.field') || lat.parentElement;
          if (!container || container.querySelector('.admin-helper-button[data-role="geolocate"]')) return;

          [lat, lon].forEach(normalizeCoordinateInput);

          lat.addEventListener('blur', function () {
            normalizeCoordinateInput(lat);
          });
          lon.addEventListener('blur', function () {
            normalizeCoordinateInput(lon);
          });

          const wrapper = document.createElement('div');
          wrapper.className = 'admin-helper-buttons';

          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'admin-helper-button';
          button.dataset.role = 'geolocate';
          button.textContent = 'Use my location';
          button.addEventListener('click', function (event) {
            event.preventDefault();
            if (!navigator.geolocation) {
              createStatus(container, 'Geolocation is not supported by this browser.', true);
              return;
            }

            navigator.geolocation.getCurrentPosition(
              function (position) {
                lat.value = position.coords.latitude.toFixed(6);
                lon.value = position.coords.longitude.toFixed(6);
                dispatchInputEvent(lat);
                dispatchInputEvent(lon);
                createStatus(container, 'Location filled from your browser.', false);
              },
              function () {
                createStatus(container, 'Location access was denied or unavailable.', true);
              }
            );
          });

          wrapper.appendChild(button);
          container.appendChild(wrapper);
        }

        function injectExifButton() {
          const imageInput = Array.from(document.querySelectorAll('input[type="file"]')).find(function (input) {
            return input.accept && input.accept.includes('image');
          });

          if (!imageInput) return;
          const container = imageInput.closest('.field') || imageInput.parentElement;
          if (!container || container.querySelector('.admin-helper-button[data-role="exif"]')) return;

          const wrapper = document.createElement('div');
          wrapper.className = 'admin-helper-buttons';

          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'admin-helper-button';
          button.dataset.role = 'exif';
          button.textContent = 'Read EXIF location';
          button.addEventListener('click', function (event) {
            event.preventDefault();
            const file = imageInput.files && imageInput.files[0];
            if (!file) {
              createStatus(container, 'Please choose an image first.', true);
              return;
            }

            createStatus(container, 'Reading image metadata…', false);
            readExifGps(file).then(function (gps) {
              const { lat, lon } = getLatLonInputs();
              if (!lat || !lon) {
                createStatus(container, 'Latitude and longitude fields were not found.', true);
                return;
              }

              if (!gps || gps.lat === null || gps.lon === null) {
                createStatus(container, 'No GPS EXIF data was found in this image.', true);
                return;
              }

              lat.value = gps.lat.toFixed(6);
              lon.value = gps.lon.toFixed(6);
              dispatchInputEvent(lat);
              dispatchInputEvent(lon);
              createStatus(container, 'Location filled from the image EXIF data.', false);
            }).catch(function () {
              createStatus(container, 'EXIF parsing failed for this image.', true);
            });
          });

          wrapper.appendChild(button);
          container.appendChild(wrapper);
          imageInput.addEventListener('change', function () {
            const file = imageInput.files && imageInput.files[0];
            if (file && file.type && file.type.startsWith('image/')) {
              createStatus(container, 'Image selected. You can read GPS data from the EXIF button.', false);
            }
          });
        }

        function attachHelpers() {
          injectGeoButton();
          injectExifButton();
        }

        window.addEventListener('load', function () {
          attachHelpers();
          let attempts = 0;
          const retry = window.setInterval(function () {
            attempts += 1;
            attachHelpers();
            if (attempts >= 10) {
              window.clearInterval(retry);
            }
          }, 400);
        });
      })();
    </script>
  </body>
</html>
